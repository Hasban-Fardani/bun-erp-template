name: Bun workspace
description: Install the pinned runtime and frozen workspace
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, verified with git ls-remote
      with:
        bun-version: 1.4.2
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified with git ls-remote
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
    - shell: bash
      run: bun install --frozen-lockfile
    - shell: bash
      # The template ships apps/ empty; every job installs the reference combination first.
      run: bun loom init --apps server,web --yes
