name: Mobile Native Build
on:
  # Only when the mobile app or the shared packages it bundles change.
  push:
    branches: [master]
    paths: ['apps/mobile/**', 'packages/**', 'bun.lock']
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', 'bun.lock']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified
      - id: check
        run: |
          if [ -f apps/mobile/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
  android:
    needs: detect
    # Mobile waits in templates/apps/mobile until `bun loom apps:create <name> mobile` installs it.
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun loom mobile:build
        env:
          VITE_API_BASE_URL: https://api.example.test
      - run: bun loom mobile:add android
        env:
          MOBILE_APP_ID: com.example.erptemplate
          MOBILE_APP_NAME: ERP Template
      - run: bun loom mobile:sync android
        env:
          MOBILE_APP_ID: com.example.erptemplate
          MOBILE_APP_NAME: ERP Template
      - run: bash apps/mobile/android/gradlew -p apps/mobile/android assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ios-simulator:
    needs: detect
    # Mobile waits in templates/apps/mobile until `bun loom apps:create <name> mobile` installs it.
    if: needs.detect.outputs.present == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified
      - uses: ./.github/actions/setup
      - run: bun loom mobile:build
        env:
          VITE_API_BASE_URL: https://api.example.test
      - run: bun loom mobile:add ios
        env:
          MOBILE_APP_ID: com.example.erptemplate
          MOBILE_APP_NAME: ERP Template
      - run: bun loom mobile:sync ios
        env:
          MOBILE_APP_ID: com.example.erptemplate
          MOBILE_APP_NAME: ERP Template
      - name: Build simulator app
        run: xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath .data/mobile-ios CODE_SIGNING_ALLOWED=NO build
      # GitHub wraps every artifact in a zip, so upload the .app bundle directly instead of pre-zipping it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-app
          path: .data/mobile-ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
