name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun erp check
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: erp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-disposable@localhost:5432/erp_ci
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable@localhost:5432/erp_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified
      - uses: ./.github/actions/setup
      - run: bun erp ci:prepare
      - run: bun erp db:migrate
      # Second run proves the ledger is idempotent (nothing is applied twice).
      - name: Migrations are idempotent
        run: bun erp db:migrate
      - run: bun erp db:status
      - run: bun erp test
  # Heavier jobs run on demand (Actions → CI → Run workflow) until the project needs them per push.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: [gates, test-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: erp_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-disposable@localhost:5432/erp_qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified
      - uses: ./.github/actions/setup
      - run: bunx --bun playwright-core install --with-deps chromium
      - run: bun erp ci:prepare
      - run: bun erp db:migrate
      - run: bun erp db:seed
      - run: bun erp ci:owner
      - run: bun erp build
      - name: Start API and built web
        run: |
          bun start > .data/qa/server.log 2>&1 &
          bun erp preview > .data/qa/preview.log 2>&1 &
          bun erp wait:http http://localhost:3000/api/v1/ready
          bun erp wait:http http://localhost:4173/login
      - run: bun run qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified
        if: always()
        with:
          name: browser-qa
          path: |
            .data/qa/qa-report.json
            .data/qa/*.log
            .data/qa/*.png
  docker:
    name: Docker image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified
      - name: Build the image
        run: docker build -t bun-erp-template .
      - name: Start a disposable PostgreSQL
        run: |
          docker network create erp
          docker run -d --name erp-db --network erp \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=ci-disposable -e POSTGRES_DB=erp_docker \
            postgres:18-alpine
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, verified with git ls-remote
        with:
          bun-version: 1.4.2
      - name: Write a disposable environment
        # Docker keeps quotes literally, so the JSON-quoted .env values are unwrapped for --env-file.
        run: |
          mkdir -p .data/qa
          DATABASE_URL=postgresql://postgres:ci-disposable@erp-db:5432/erp_docker bun cli/tasks/ci-prepare.ts
          sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' .env | grep -Ev '^\s*(#|$)' > docker.env
      - name: Run the image against it
        run: |
          docker run -d --name erp-app --network erp -p 3000:3000 --env-file docker.env \
            -e APP_DEPLOY_TARGET=bun -e APP_WEB_MODE=integrated \
            bun-erp-template
      - name: Wait for the readiness endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/ready; then exit 0; fi
            sleep 2
          done
          docker logs erp-app
          exit 1
  ci-ok:
    if: always()
    needs: [gates, test-postgres, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require gates and tests; on-demand jobs may skip
        env:
          RESULTS: ${{ toJSON(needs) }}
          OPTIONAL: ${{ github.event_name == 'workflow_dispatch' && '' || 'e2e docker' }}
        run: |
          python3 -c 'import json,os,sys; r=json.loads(os.environ["RESULTS"]); o=os.environ["OPTIONAL"].split(); sys.exit(any(j["result"] != "success" and not (n in o and j["result"] == "skipped") for n,j in r.items()))'
