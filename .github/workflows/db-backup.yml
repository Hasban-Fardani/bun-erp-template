name: Database Backup
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL || secrets.DATABASE_URL }}
      R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
    steps:
      - name: Install the PostgreSQL 18 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
      - name: Dump the database (custom format)
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "BACKUP_DATABASE_URL or DATABASE_URL secret is not set" >&2; exit 1; }
          umask 077
          pg_dump --format=custom --no-owner --no-privileges --file "erp-$(date -u +%Y%m%dT%H%M%SZ).dump" "$DATABASE_URL"
          pg_restore --list erp-*.dump > /dev/null
          ls -l erp-*.dump
      - name: Upload to R2 (S3 API)
        if: ${{ env.R2_BACKUP_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: aws s3 cp --endpoint-url "$R2_ENDPOINT" --no-progress erp-*.dump "s3://$R2_BACKUP_BUCKET/db/"
      - name: Keep as a workflow artifact (no R2 bucket configured)
        if: ${{ env.R2_BACKUP_BUCKET == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4, verified
        with:
          name: db-backup
          path: erp-*.dump
          retention-days: 14
          if-no-files-found: error
