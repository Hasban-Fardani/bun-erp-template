name: Cloudflare Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: erp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable@localhost:5432/erp_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified
      - uses: ./.github/actions/setup
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_APP_URL: ${{ vars.CLOUDFLARE_APP_URL }}
        run: bun cli/tasks/cloudflare-preflight.ts
      - run: bun erp check
      - run: bun erp test
      - run: bun erp cloudflare:build
      - name: Apply database migrations
        run: bun erp db:migrate
        env: &production-env
          APP_NAME: Bun ERP Template
          APP_ENV: production
          APP_URL: ${{ vars.CLOUDFLARE_APP_URL }}
          APP_PORT: "8787"
          APP_RELEASE: ${{ github.sha }}
          APP_TIMEZONE: UTC
          LOG_DRIVER: console
          LOG_LEVEL: info
          LOG_PATH: stdout
          LOG_RETENTION_DAYS: "30"
          LOG_MAX_SIZE_MB: "50"
          TRUST_PROXY: "true"
          DATABASE_DRIVER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POOL_MAX: "5"
          DATABASE_SSL_MODE: require
          BETTER_AUTH_URL: ${{ vars.CLOUDFLARE_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.CLOUDFLARE_APP_URL }}
          STORAGE_DRIVER: r2
          STORAGE_R2_BINDING: STORAGE
          STORAGE_LOCAL_ROOT: .data/storage
          MAIL_DRIVER: log
          MAIL_FROM_ADDRESS: no-reply@example.test
          MAIL_FROM_NAME: Bun ERP Template
          SMTP_HOST: ""
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_USERNAME: ""
          FEATURE_ADVANCED_REPORTS: "false"
      - name: Seed base records
        run: bun erp db:seed
        env: *production-env
      - name: Deploy API and web assets
        run: |
          # Secret-class keys travel only through wrangler secret bulk, never through wrangler.jsonc vars.
          umask 077
          mkdir -p .data
          {
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'MAIL_API_KEY=%s\n' "$MAIL_API_KEY"
          } > .data/secrets.env
          bun erp env:cloudflare --env-file .data/secrets.env
          rm -f .data/secrets.env
          bun run --cwd apps/web wrangler secret bulk ../../.data/cloudflare-secrets.json --config dist/bun_erp_template/wrangler.json
          rm -f .data/cloudflare-secrets.json
          bun run --cwd apps/web wrangler deploy --config dist/bun_erp_template/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
      - name: Smoke test /api/v1/ready
        # Fails the job (and points at `wrangler rollback`, docs/deployment.md) unless the new version answers 200.
        env:
          CLOUDFLARE_APP_URL: ${{ vars.CLOUDFLARE_APP_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${CLOUDFLARE_APP_URL%/}/api/v1/ready" || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Readiness never returned 200. Roll back: bun run --cwd apps/web wrangler rollback --config dist/bun_erp_template/wrangler.json" >&2
          exit 1
